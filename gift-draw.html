<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family gift draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f5f9; --card:#fff; --ink:#1f2a44; --muted:#5d6882; --accent:#e4572e; --line:#d9dfea; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); display:flex; justify-content:center; padding:24px 16px;
    font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; }
  main { width:100%; max-width:460px; }
  h1 { font-size:2rem; font-weight:800; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  label { display:block; font-weight:600; margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  select, input { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:10px; padding:12px 18px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:#b3261e; }
  button.sm { padding:4px 10px; font-size:.85rem; }
  :focus-visible { outline:3px solid #2a7fff; outline-offset:2px; }
  .hidden { display:none !important; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; background:transparent; color:var(--ink); border:1px solid var(--line); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .row { display:flex; gap:10px; margin-top:14px; }
  .row > * { flex:1; }
  .msg { color:var(--muted); font-size:.95rem; margin:12px 0 0; }
  .msg.err { color:#b3261e; }
  .msg.ok { color:#1d7a46; }
  .notice { background:#fff3cd; color:#6b5200; border-radius:10px; padding:10px 12px; font-size:.95rem; margin-bottom:12px; }
  .stage { position:relative; width:300px; max-width:100%; margin:12px auto 8px; aspect-ratio:1; }
  #wheel { width:100%; height:100%; border-radius:50%; border:6px solid var(--ink); }
  .pointer { position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:2; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:26px solid var(--ink); }
  .hub { position:absolute; inset:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:var(--ink); z-index:1; }
  #count ul { list-style:none; padding:0; margin:8px 0 0; }
  #count li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); color:var(--ink); }
  #count .done { color:#1d7a46; font-weight:600; }
  #result { text-align:center; }
  #result .name { font-size:2.2rem; font-weight:800; color:var(--accent); margin:6px 0; }
  details { margin-top:20px; } summary { cursor:pointer; color:var(--muted); }
  ul#playerList { list-style:none; padding:0; margin:10px 0 0; }
  ul#playerList li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { #wheel { transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Family gift draw</h1>
  <p class="sub">Join the list with a name and PIN. Once everyone is in, you can sign in and spin.</p>

  <!-- START: join or sign in -->
  <section class="card" id="stepStart">
    <div class="tabs">
      <button id="tabJoin" class="on">Join the list</button>
      <button id="tabIn">Sign in</button>
    </div>

    <div id="formJoin">
      <label for="newName">Your name</label>
      <input id="newName" maxlength="20" autocomplete="off">
      <label for="newPin">Choose a PIN (at least 4 characters)</label>
      <input id="newPin" type="password" autocomplete="off">
      <label for="newPin2">Repeat the PIN</label>
      <input id="newPin2" type="password" autocomplete="off">
      <div class="row"><button id="joinBtn">Add me to the list</button></div>
      <p class="msg hidden" id="joinMsg"></p>
    </div>

    <div id="formIn" class="hidden">
      <label for="who">Your name</label>
      <select id="who"></select>
      <label for="inPin">Your PIN</label>
      <input id="inPin" type="password" autocomplete="off">
      <div id="resetBox" class="hidden">
        <label for="resetPin1">New PIN (at least 4 characters)</label>
        <input id="resetPin1" type="password" autocomplete="off">
        <label for="resetPin2">Repeat the new PIN</label>
        <input id="resetPin2" type="password" autocomplete="off">
      </div>
      <div class="row"><button id="inBtn">Sign in</button></div>
      <p class="msg hidden" id="inMsg"></p>
    </div>

    <div class="msg" id="count"></div>
  </section>

  <!-- SPIN -->
  <section class="card hidden" id="stepSpin">
    <div class="notice hidden" id="spinInfo"></div>
    <div class="stage">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
      <div class="hub"></div>
    </div>
    <div class="row">
      <button class="ghost" id="backBtn">Sign out</button>
      <button id="spinBtn">Spin</button>
    </div>
    <p class="msg err hidden" id="spinMsg"></p>
  </section>

  <!-- RESULT -->
  <section class="card hidden" id="stepResult">
    <div id="result">
      <p>You are buying a gift for</p>
      <p class="name" id="resultName"></p>
      <p class="msg">Keep it secret. Sign in again with your PIN anytime to check.</p>
    </div>
    <div class="row"><button class="ghost" id="doneBtn">Sign out</button></div>
  </section>

  <!-- ADMIN -->
  <details id="admin">
    <summary>Admin</summary>
    <div class="card" style="margin-top:10px">
      <div id="adminLock">
        <label for="pin">Admin PIN</label>
        <input id="pin" type="password" autocomplete="off">
        <div class="row"><button id="adminBtn">Unlock</button></div>
      </div>
      <div id="adminPanel" class="hidden">
        <p class="msg" id="adminInfo" style="margin-top:0"></p>
        <ul id="playerList"></ul>
        <div class="row"><button id="toggleBtn">Start spinning</button></div>
        <div class="row">
          <button class="danger" id="clearBtn">Clear draws</button>
          <button class="danger" id="resetBtn">Reset everything</button>
        </div>
        <p class="msg" style="font-size:.85rem">Clear draws keeps the names. Reset everything also removes every name and PIN.</p>
      </div>
      <p class="msg hidden" id="adminMsg"></p>
    </div>
  </details>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN_PIN = "1234"; // change before real use (casual protection only)

const firebaseConfig = {
  apiKey: "AIzaSyARGVXjnuB-6XXV0hu8NPdsZIfvDnrUWgY",
  authDomain: "marumane-polls.firebaseapp.com",
  projectId: "marumane-polls",
  storageBucket: "marumane-polls.firebasestorage.app",
  messagingSenderId: "286904986849",
  appId: "1:286904986849:web:745b61fdeb1367b3425ba0"
};
const db = getFirestore(initializeApp(firebaseConfig));
const ref = doc(db, "giftDraw", "state");

/* One document holds everything:
   { players: { name: pinHash }, open: false, draws: { giver: receiver } } */
const empty = () => ({ players: {}, open: false, draws: {} });

async function mutate(fn) {          // runs safely even if two people save at once
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const st = snap.exists() ? { ...empty(), ...snap.data() } : empty();
    const out = fn(st);
    tx.set(ref, st);
    return out;
  });
}

function availableFor(st, giver) {
  const names = Object.keys(st.players);
  const taken = new Set(Object.values(st.draws));
  let list = names.filter((n) => n !== giver && !taken.has(n));
  const waiting = names.filter((n) => !st.draws[n] && n !== giver);
  // avoid a dead end where the last person would only have themselves left
  if (waiting.length === 1 && list.includes(waiting[0]) && list.length === 2) list = [waiting[0]];
  return list;
}

const Store = {
  async getState() { const s = await getDoc(ref); return s.exists() ? { ...empty(), ...s.data() } : empty(); },
  join: (name, hash) => mutate((st) => {
    if (st.open || Object.keys(st.draws).length) return "closed";
    if (Object.keys(st.players).some((n) => n.toLowerCase() === name.toLowerCase())) return "taken";
    st.players[name] = hash; return "ok";
  }),
  draw: (giver) => mutate((st) => {
    if (st.draws[giver]) return { ok: true, receiver: st.draws[giver] };
    if (!st.open) return { ok: false, reason: "closed" };
    const left = availableFor(st, giver);
    if (!left.length) return { ok: false, reason: "none" };
    const receiver = left[Math.floor(Math.random() * left.length)];
    st.draws[giver] = receiver;
    return { ok: true, receiver };
  }),
  setOpen: (open) => mutate((st) => { st.open = open; }),
  clearDraws: () => mutate((st) => { st.draws = {}; }),
  resetAll: () => mutate((st) => { st.players = {}; st.draws = {}; st.open = false; }),
  removePlayer: (n) => mutate((st) => { if (!st.open && !Object.keys(st.draws).length) delete st.players[n]; }),
  resetPin: (n) => mutate((st) => { if (n in st.players) st.players[n] = ""; }),     // "" = person must choose a new PIN
  setPin: (n, hash) => mutate((st) => { if (st.players[n] === "") { st.players[n] = hash; return true; } return false; })
};

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["#e4572e", "#2a9d8f", "#f2b134", "#5b6ee1", "#d1478c", "#6bb04a"];
let me = null, state = empty(), displayNames = [], spinning = false;

function say(id, msg, kind = "err") {
  const e = $(id); e.textContent = msg;
  e.classList.remove("err", "ok"); if (msg) e.classList.add(kind);
  e.classList.toggle("hidden", !msg);
}
function show(step) { for (const id of ["stepStart", "stepSpin", "stepResult"]) $(id).classList.toggle("hidden", id !== step); }

async function hashPin(name, pin) {
  const s = name.toLowerCase() + ":" + pin + ":giftdraw";
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "f" + h;
}

/* ---------- start screen ---------- */
function tab(which) {
  $("formJoin").classList.toggle("hidden", which !== "join");
  $("formIn").classList.toggle("hidden", which !== "in");
  $("tabJoin").classList.toggle("on", which === "join");
  $("tabIn").classList.toggle("on", which === "in");
}
$("tabJoin").onclick = () => tab("join");
$("tabIn").onclick = () => tab("in");

function renderStart() {
  const names = Object.keys(state.players);
  $("who").innerHTML = '<option value="">Choose your name</option>' + names.map((n) => `<option value="${esc(n)}">${esc(n)}${state.draws[n] ? " (already spun)" : ""}</option>`).join("");
  $("count").innerHTML = names.length
    ? `${names.length} on the list:<ul>` + names.map((n) => `<li><span>${esc(n)}</span><span class="${state.draws[n] ? "done" : ""}">${state.draws[n] ? "&#10003; Spun" : "Not spun yet"}</span></li>`).join("") + "</ul>"
    : "Nobody has joined yet.";
}
async function load() { state = await Store.getState(); renderStart(); }

$("joinBtn").onclick = async () => {
  const name = $("newName").value.trim().replace(/\s+/g, " ").slice(0, 20);
  const pin = $("newPin").value, pin2 = $("newPin2").value;
  if (!name) return say("joinMsg", "Enter your name.");
  if (pin.length < 4) return say("joinMsg", "The PIN must be at least 4 characters.");
  if (pin !== pin2) return say("joinMsg", "The two PINs do not match.");
  try {
    const r = await Store.join(name, await hashPin(name, pin));
    if (r === "taken") return say("joinMsg", "That name is already on the list. Use Sign in instead.");
    if (r === "closed") return say("joinMsg", "The list is closed because the draw has started.");
    $("newName").value = $("newPin").value = $("newPin2").value = "";
    say("joinMsg", "");
    await load(); tab("in"); $("who").value = name;
    say("inMsg", "You are on the list. Remember your PIN, then sign in when spinning opens.", "ok");
  } catch (e) { say("joinMsg", "Could not save: " + e.message); }
};

$("inBtn").onclick = async () => {
  const name = $("who").value, pin = $("inPin").value;
  if (!name) return say("inMsg", "Choose your name.");
  try {
    state = await Store.getState();
    const stored = state.players[name];
    if (stored === "") {                       // the admin reset this PIN: the person chooses a new one
      if ($("resetBox").classList.contains("hidden")) {
        $("resetBox").classList.remove("hidden");
        return say("inMsg", "Your PIN was reset by the admin. Choose a new PIN below, then tap Sign in.", "ok");
      }
      const p1 = $("resetPin1").value, p2 = $("resetPin2").value;
      if (p1.length < 4) return say("inMsg", "The new PIN must be at least 4 characters.");
      if (p1 !== p2) return say("inMsg", "The two PINs do not match.");
      if (!(await Store.setPin(name, await hashPin(name, p1)))) return say("inMsg", "Could not set the PIN. Try again.");
      $("resetPin1").value = $("resetPin2").value = ""; $("resetBox").classList.add("hidden");
    } else if (stored !== await hashPin(name, pin)) return say("inMsg", "Wrong PIN.");
    me = name; $("inPin").value = ""; say("inMsg", "");
    if (state.draws[me]) { $("resultName").textContent = state.draws[me]; show("stepResult"); }
    else openSpin();
  } catch (e) { say("inMsg", "Could not sign in: " + e.message); }
};

$("who").onchange = () => $("resetBox").classList.add("hidden");
$("doneBtn").onclick = $("backBtn").onclick = async () => { me = null; await load(); show("stepStart"); };

/* ---------- wheel ---------- */
function drawWheel() {
  const c = $("wheel"), ctx = c.getContext("2d"), r = c.width / 2, names = displayNames.length ? displayNames : ["-"];
  ctx.clearRect(0, 0, c.width, c.height);
  const seg = (Math.PI * 2) / names.length;
  names.forEach((n, i) => {
    const a0 = -Math.PI / 2 + i * seg;
    ctx.beginPath(); ctx.moveTo(r, r); ctx.arc(r, r, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(r, r); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.max(22, Math.min(36, 320 / names.length))}px sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(n, r - 36, 0, 210);
    ctx.restore();
  });
}
function rebuildWheel() {
  displayNames = Object.keys(state.players).filter((n) => n !== me);   // everyone else, so nothing is given away
  drawWheel();
  const w = $("wheel"); w.style.transition = "none"; w.style.transform = "rotate(0deg)"; void w.offsetWidth;
}
function updateSpinInfo() {
  const n = Object.keys(state.players).length, box = $("spinInfo");
  if (state.open) { box.classList.add("hidden"); return; }
  box.textContent = `You cannot spin yet. Spinning opens when everyone is on the list and the admin starts it. ${n} ${n === 1 ? "person has" : "people have"} joined so far.`;
  box.classList.remove("hidden");
}
function openSpin() { say("spinMsg", ""); rebuildWheel(); updateSpinInfo(); show("stepSpin"); }

$("spinBtn").onclick = async () => {
  if (spinning) return;
  spinning = true; $("spinBtn").disabled = $("backBtn").disabled = true; say("spinMsg", "");
  try {
    const r = await Store.draw(me);          // the pick is made and saved first, quietly
    state = await Store.getState();
    if (!r.ok) {
      updateSpinInfo();
      say("spinMsg", r.reason === "closed" ? "You cannot spin yet. Please wait until the admin starts spinning."
        : "No names are left to draw. Ask the admin to clear the draws.");
      return;
    }
    rebuildWheel();
    const seg = 360 / displayNames.length, win = Math.max(0, displayNames.indexOf(r.receiver));
    const w = $("wheel");
    w.style.transition = "transform 4.5s cubic-bezier(.12,.7,.15,1)";
    w.style.transform = `rotate(${360 * 6 + (360 - (win + 0.5) * seg)}deg)`;
    await new Promise((res) => setTimeout(res, 4700));
    $("resultName").textContent = r.receiver; show("stepResult");
  } catch (e) { say("spinMsg", "Something went wrong: " + e.message); }
  finally { spinning = false; $("spinBtn").disabled = $("backBtn").disabled = false; }
};

/* ---------- admin ---------- */
async function renderAdmin() {
  state = await Store.getState();
  const names = Object.keys(state.players), drawn = Object.keys(state.draws).length, locked = state.open || drawn > 0;
  $("adminInfo").textContent = `${names.length} joined. ${drawn} drawn. Spinning is ${state.open ? "ON" : "OFF"}.`;
  $("playerList").innerHTML = names.map((n) => `<li><span>${esc(n)}${state.draws[n] ? " (drawn)" : ""}${state.players[n] === "" ? " (PIN reset)" : ""}</span><span><button class="ghost sm" data-pin="${esc(n)}">Reset PIN</button>${locked ? "" : ` <button class="ghost sm" data-rm="${esc(n)}">Remove</button>`}</span></li>`).join("");
  $("toggleBtn").textContent = state.open ? "Pause spinning" : "Start spinning";
}
async function safely(fn) { try { say("adminMsg", ""); await fn(); } catch (e) { say("adminMsg", "Failed: " + e.message); } }

$("adminBtn").onclick = () => safely(async () => {
  if ($("pin").value !== ADMIN_PIN) return say("adminMsg", "Wrong PIN.");
  $("adminLock").classList.add("hidden"); $("adminPanel").classList.remove("hidden"); await renderAdmin();
});
$("toggleBtn").onclick = () => safely(async () => {
  await renderAdmin();
  if (!state.open && Object.keys(state.players).length < 3) return say("adminMsg", "At least 3 people must join before spinning can start.");
  await Store.setOpen(!state.open); await renderAdmin();
  say("adminMsg", state.open ? "Spinning is now ON." : "Spinning is paused.", "ok");
});
$("playerList").onclick = (e) => {
  const btn = e.target, rm = btn.dataset && btn.dataset.rm, pn = btn.dataset && btn.dataset.pin;
  if (rm) return safely(async () => { await Store.removePlayer(rm); await renderAdmin(); });
  if (!pn) return;
  if (!btn.dataset.armed) {                      // two taps to reset a PIN
    btn.dataset.armed = "1"; btn.textContent = "Tap again";
    setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Reset PIN"; }, 5000); return;
  }
  safely(async () => { await Store.resetPin(pn); await renderAdmin(); say("adminMsg", `${pn} can now choose a new PIN when they sign in. Their draw is unchanged.`, "ok"); });
};
function confirmTap(btn, label, action) {       // two taps, so nothing is wiped by accident
  let timer = null;
  btn.onclick = () => {
    if (!timer) { btn.textContent = "Tap again to confirm"; timer = setTimeout(() => { timer = null; btn.textContent = label; }, 5000); return; }
    clearTimeout(timer); timer = null; btn.textContent = label; safely(action);
  };
}
confirmTap($("clearBtn"), "Clear draws", async () => { await Store.clearDraws(); await renderAdmin(); say("adminMsg", "Draws cleared. Names are still on the list.", "ok"); });
confirmTap($("resetBtn"), "Reset everything", async () => { await Store.resetAll(); await renderAdmin(); say("adminMsg", "Everything has been reset.", "ok"); });

/* ---------- start ---------- */
(async () => {
  try { await load(); }
  catch (e) { say("joinMsg", "Cannot reach the database. Check the Firestore rules and your connection. (" + e.message + ")"); }
})();
</script>
</body>
</html>
